name: Release – build cross-platform binaries

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag_name:
        description: 'Tag to create/update the release for (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build-and-publish-release:
    name: Build binaries and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tests
        run: node --test tests/test_quick_json_reader.js

      - name: Prepare dist directory
        run: mkdir -p dist

      - name: Install packager (yao-pkg fork, maintained)
        run: npm install --no-save @yao-pkg/pkg

      - name: Build cross-platform binaries
        run: |
          npx pkg src/quick_json_reader.js \
            --targets node20-linux-x64,node20-linux-arm64,node20-macos-x64,node20-macos-arm64,node20-win-x64 \
            --output dist/quick-json-reader

      - name: Integration test - exercise packaged linux-x64 binary with complex flags
        run: |
          integration_test_input_path=/tmp/integration_test_input.json
          integration_test_expected_path=/tmp/integration_test_expected.json
          integration_test_actual_path=/tmp/integration_test_actual.json

          cat > "$integration_test_input_path" <<'INPUT_JSON'
          {
            "users": [
              {
                "id": 1,
                "name": "Alice",
                "token": "SECRET_A",
                "events": [
                  {"type": "login",    "status": "ok"},
                  {"type": "purchase", "status": "failed"}
                ]
              },
              {
                "id": 2,
                "name": "Bob",
                "token": "SECRET_B",
                "events": [
                  {"type": "login", "status": "ok"}
                ]
              }
            ],
            "system": {
              "status": "ok",
              "password": "SUPER_SECRET"
            }
          }
          INPUT_JSON

          # Expected: find all "failed" records, include their children,
          # exclude token + password entirely, emit JSON with jsonStats prepended.
          cat > "$integration_test_expected_path" <<'EXPECTED_JSON'
          {
            "jsonStats": {
              "nestingDepth": 6,
              "totalObjects": 7,
              "totalArrays": 3,
              "jsonValid": true
            },
            "users": [
              {
                "events": [
                  {
                    "status": "failed"
                  }
                ]
              }
            ]
          }
          EXPECTED_JSON

          integration_test_binary=./dist/quick-json-reader-linux-x64
          if [ ! -f "$integration_test_binary" ]; then
            integration_test_binary=./dist/quick-json-reader-linux
          fi
          chmod +x "$integration_test_binary"

          "$integration_test_binary" "$integration_test_input_path" \
            --search-vals failed \
            --include-search-children \
            --exclude-fields-matching token password \
            --show-stats \
            --output json \
            > "$integration_test_actual_path"

          echo "--- expected ---"
          cat "$integration_test_expected_path"
          echo "--- actual ---"
          cat "$integration_test_actual_path"

          # Compare as parsed JSON (normalizes whitespace) so minor
          # totalCharCount shifts from heredoc indentation do not false-fail.
          # We still require deep structural equality.
          node - "$integration_test_expected_path" "$integration_test_actual_path" <<'COMPARISON_SCRIPT'
          const fs = require('node:fs');
          const [, , expectedPath, actualPath] = process.argv;
          const expected = JSON.parse(fs.readFileSync(expectedPath, 'utf8'));
          const actual   = JSON.parse(fs.readFileSync(actualPath,   'utf8'));

          // totalCharCount depends on exact input bytes; assert it's a positive number, then strip before deep compare.
          if (typeof actual.jsonStats?.totalCharCount !== 'number' || actual.jsonStats.totalCharCount <= 0) {
            console.error('INTEGRATION FAIL: jsonStats.totalCharCount missing or non-positive');
            process.exit(1);
          }
          delete expected.jsonStats.totalCharCount;
          delete actual.jsonStats.totalCharCount;

          const stringifiedExpected = JSON.stringify(expected);
          const stringifiedActual   = JSON.stringify(actual);
          if (stringifiedExpected !== stringifiedActual) {
            console.error('INTEGRATION FAIL: transform output does not match expected');
            console.error('expected (no totalCharCount):', stringifiedExpected);
            console.error('actual   (no totalCharCount):', stringifiedActual);
            process.exit(1);
          }
          console.log('INTEGRATION OK: complex flag combo produced expected transform');
          COMPARISON_SCRIPT

      - name: Build web release zip (static HTML + shared engine)
        run: |
          mkdir -p dist/web-stage
          cp web-ui/quick_json_reader_web.html dist/web-stage/
          cp src/quick_json_reader.js dist/web-stage/
          cd dist/web-stage
          zip ../quick-json-reader-web.zip quick_json_reader_web.html quick_json_reader.js

      - name: Build Android-native arm64 binary via QuickJS + static cross-compile
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user-static

          quickjs_dir=/tmp/quickjs_source_clone
          android_build_dir=/tmp/android_build_staging
          mkdir -p "$android_build_dir"
          git clone --depth=1 https://github.com/bellard/quickjs "$quickjs_dir"

          # 1. Build host tooling (qjsc + host libquickjs.a)
          pushd "$quickjs_dir"
          make -j2 qjsc
          cp qjsc "$android_build_dir/host_qjsc"
          # 2. Rebuild libquickjs.a for aarch64 target only
          make clean
          make -j2 libquickjs.a CROSS_PREFIX=aarch64-linux-gnu- CONFIG_LTO=
          cp libquickjs.a "$android_build_dir/libquickjs_arm64.a"
          popd

          # 3. Compose shim + source into a single ES module (runs as one file)
          cat > "$android_build_dir/combined.js" <<'JS_COMBINED_SHIM_PREFIX'
          import * as std from 'std';
          import * as os from 'os';

          // quickjs-libc's js_std_add_helpers exposes globalThis.scriptArgs
          // as the full argv including argv[0] (the binary path). Slice it
          // off so the CLI sees only user-provided arguments.
          const nativeScriptArgs = Array.isArray(globalThis.scriptArgs)
            ? globalThis.scriptArgs.slice(1)
            : [];

          globalThis.process = {
            argv: ['qjs-native', 'quick_json_reader.js', ...nativeScriptArgs],
            stdout: { write: (text) => { std.out.puts(text); return true; } },
            stderr: { write: (text) => { std.err.puts(text); return true; } },
            exitCode: 0,
            exit: (code) => { std.exit(code | 0); },
          };
          globalThis.require = (moduleName) => {
            if (moduleName === 'node:fs' || moduleName === 'fs') {
              return {
                readFileSync: (filePath, encoding) => {
                  const content = std.loadFile(filePath);
                  if (content === null) {
                    const error = new Error(filePath);
                    error.code = 'ENOENT';
                    throw error;
                  }
                  return content;
                },
              };
            }
            throw new Error('unsupported require in android build: ' + moduleName);
          };
          globalThis.module = { exports: {} };
          globalThis.require.main = globalThis.module;

          JS_COMBINED_SHIM_PREFIX
          # QuickJS module parser does not accept a "#!" shebang (reads # as
          # a private-identifier start). Strip it if present before concat.
          sed -E '1{/^#!/d;}' src/quick_json_reader.js >> "$android_build_dir/combined.js"
          cat >> "$android_build_dir/combined.js" <<'JS_COMBINED_SHIM_SUFFIX'

          // Drain the event loop, then exit with the code the CLI wrote to process.exitCode.
          std.exit(globalThis.process.exitCode | 0);
          JS_COMBINED_SHIM_SUFFIX

          # 4. Host-compile combined.js to embedded bytecode C source.
          #    -c emits a bytecode-only C file (no main) with externally-visible symbols.
          #    -m treats input as an ES module.
          #    -N sets the exported symbol basename so main.c can reference it.
          "$android_build_dir/host_qjsc" -c -m -N combined_bytecode \
            -o "$android_build_dir/combined_bytecode.c" \
            "$android_build_dir/combined.js"

          # 5. Minimal C main. qjsc -c emits the bytecode symbols as `static`
          #    (file-local), so we bring them into the same translation unit
          #    via #include rather than linking them separately.
          cat > "$android_build_dir/main_android_arm64_entry.c" <<'C_MAIN'
          #include <stdint.h>
          #include <stddef.h>
          #include "quickjs-libc.h"
          #include "combined_bytecode.c"

          int main(int argc, char **argv) {
            JSRuntime *runtime = JS_NewRuntime();
            js_std_init_handlers(runtime);

            JSContext *ctx = JS_NewContext(runtime);
            js_std_add_helpers(ctx, argc, argv);
            js_init_module_std(ctx, "std");
            js_init_module_os(ctx, "os");

            js_std_eval_binary(ctx, combined_bytecode, combined_bytecode_size, 0);
            js_std_loop(ctx);

            js_std_free_handlers(runtime);
            JS_FreeContext(ctx);
            JS_FreeRuntime(runtime);
            return 0;
          }
          C_MAIN

          # 6. Cross-compile: -I for quickjs headers, another -I for the
          #    android_build_dir so #include "combined_bytecode.c" resolves.
          aarch64-linux-gnu-gcc -static -O2 \
            -I "$quickjs_dir" \
            -I "$android_build_dir" \
            "$android_build_dir/main_android_arm64_entry.c" \
            "$android_build_dir/libquickjs_arm64.a" \
            -lm -lpthread -ldl \
            -o dist/quick-json-reader-android-arm64

          file dist/quick-json-reader-android-arm64
          ls -la dist/quick-json-reader-android-arm64

      - name: Integration test - exercise android-arm64 binary under qemu with complex flags
        run: |
          set -euo pipefail
          android_integration_actual_path=/tmp/android_integration_actual.json

          qemu-aarch64-static dist/quick-json-reader-android-arm64 \
            /tmp/integration_test_input.json \
            --search-vals failed \
            --include-search-children \
            --exclude-fields-matching token password \
            --show-stats \
            --output json \
            > "$android_integration_actual_path"

          echo "--- android-arm64 actual ---"
          cat "$android_integration_actual_path"

          node - /tmp/integration_test_expected.json "$android_integration_actual_path" <<'ANDROID_COMPARISON_SCRIPT'
          const fs = require('node:fs');
          const [, , expectedPath, actualPath] = process.argv;
          const expected = JSON.parse(fs.readFileSync(expectedPath, 'utf8'));
          const actual   = JSON.parse(fs.readFileSync(actualPath,   'utf8'));
          if (typeof actual.jsonStats?.totalCharCount !== 'number' || actual.jsonStats.totalCharCount <= 0) {
            console.error('ANDROID INTEGRATION FAIL: jsonStats.totalCharCount missing or non-positive');
            process.exit(1);
          }
          delete expected.jsonStats?.totalCharCount;
          delete actual.jsonStats.totalCharCount;
          if (JSON.stringify(expected) !== JSON.stringify(actual)) {
            console.error('ANDROID INTEGRATION FAIL: transform output does not match expected');
            console.error('expected:', JSON.stringify(expected));
            console.error('actual  :', JSON.stringify(actual));
            process.exit(1);
          }
          console.log('ANDROID INTEGRATION OK: android-arm64 binary produced expected transform under qemu');
          ANDROID_COMPARISON_SCRIPT

      - name: Build any-Node / Android-via-Termux script zip
        run: |
          mkdir -p dist/script-stage
          cp src/quick_json_reader.js dist/script-stage/
          cat > dist/script-stage/README-ANDROID-AND-ANY-NODE.txt <<'EOF'
          Quick JSON Reader - any-platform Node script

          This zip contains the single-file engine (quick_json_reader.js).
          It runs anywhere Node.js 18+ is available, including:

          - Android via Termux:
              pkg install nodejs
              node quick_json_reader.js your-file.json --show-stats
          - Android via proot-distro / UserLAnd (Debian/Arch/etc.)
          - ChromeOS Linux container
          - Any Linux/macOS/Windows box with Node installed

          No native binary, no architecture limits. See
          https://github.com/RandyHaylor/quick-json-reader for CLI flags.
          EOF
          cd dist/script-stage
          zip ../quick-json-reader-nodejs-script.zip quick_json_reader.js README-ANDROID-AND-ANY-NODE.txt

      - name: Rename/stage release artifacts
        run: |
          cd dist
          echo "Raw pkg output:"
          ls -la
          # yao-pkg in recent versions outputs:
          #   quick-json-reader-linux-x64
          #   quick-json-reader-linux-arm64
          #   quick-json-reader-macos-x64
          #   quick-json-reader-macos-arm64
          #   quick-json-reader-win-x64.exe
          # Older versions used "-linux" / "-win.exe" — handle both robustly.
          if [ -f quick-json-reader-linux ] && [ ! -f quick-json-reader-linux-x64 ]; then
            mv quick-json-reader-linux quick-json-reader-linux-x64
          fi
          if [ -f quick-json-reader-win.exe ] && [ ! -f quick-json-reader-win-x64.exe ]; then
            mv quick-json-reader-win.exe quick-json-reader-win-x64.exe
          fi

          for binary_name in quick-json-reader-linux-x64 quick-json-reader-linux-arm64 quick-json-reader-macos-x64 quick-json-reader-macos-arm64 quick-json-reader-android-arm64; do
            if [ -f "$binary_name" ]; then
              tar -czf "${binary_name}.tar.gz" "$binary_name"
            else
              echo "MISSING: $binary_name (will fail fast below)"
            fi
          done

          if [ -f quick-json-reader-win-x64.exe ]; then
            zip quick-json-reader-win-x64.zip quick-json-reader-win-x64.exe
          else
            echo "MISSING: quick-json-reader-win-x64.exe"
          fi

          echo "Staged artifacts:"
          ls -la

          # Fail fast if any expected archive did not get produced.
          for required_archive in \
            quick-json-reader-linux-x64.tar.gz \
            quick-json-reader-linux-arm64.tar.gz \
            quick-json-reader-macos-x64.tar.gz \
            quick-json-reader-macos-arm64.tar.gz \
            quick-json-reader-android-arm64.tar.gz \
            quick-json-reader-win-x64.zip \
            quick-json-reader-web.zip \
            quick-json-reader-nodejs-script.zip; do
            if [ ! -f "$required_archive" ]; then
              echo "REQUIRED ARCHIVE MISSING: $required_archive"
              exit 1
            fi
          done

      - name: Resolve release tag name
        id: resolve_release_tag
        run: |
          if [ -n "${{ github.event.inputs.release_tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.release_tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub Release with binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve_release_tag.outputs.tag }}
          name: ${{ steps.resolve_release_tag.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/quick-json-reader-linux-x64.tar.gz
            dist/quick-json-reader-linux-arm64.tar.gz
            dist/quick-json-reader-macos-x64.tar.gz
            dist/quick-json-reader-macos-arm64.tar.gz
            dist/quick-json-reader-android-arm64.tar.gz
            dist/quick-json-reader-win-x64.zip
            dist/quick-json-reader-web.zip
            dist/quick-json-reader-nodejs-script.zip
